<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mi Control Horario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF7F1; --card:#FFFFFF; --ink:#3E3A34; --muted:#8B8579; --border:#EAE3D5;
    --peach:#F2C4A6; --butter:#EFD98C; --peach-light:#FBEBDE;
    --sky:#A7C6DC; --sky-light:#E7F1F7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-tap-highlight-color:transparent; padding-bottom:40px;}
  h1,h2{font-family:'Fraunces','Georgia',serif; font-weight:700; margin:0;}

  .app-shell{max-width:560px; margin:0 auto;}

  header.top{padding:26px 18px 10px; text-align:center;}
  header.top h1{font-size:22px;}
  header.top .sub{font-size:12.5px; color:var(--muted); margin-top:4px;}

  main{padding:4px 16px 30px;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:14px; box-shadow:0 1px 2px rgba(62,58,52,.04);}

  .btn{border:none; border-radius:12px; padding:10px 16px; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  .btn:active{transform:scale(.97);}
  .btn-add{background:var(--ink); color:#FFF9EF;}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:9px;}

  input[type=number], input[type=file], select{
    font-family:'Inter',sans-serif; border:1px solid var(--border); background:#FFFDF9; border-radius:9px;
    padding:8px 10px; font-size:14px; color:var(--ink); width:100%;
  }
  input:focus, select:focus{outline:2px solid var(--sky); outline-offset:1px;}

  .month-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px;}
  .month-nav button{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-weight:600; cursor:pointer; flex:0 0 auto;}
  .month-nav .label{text-align:center;}
  .month-nav .label h2{font-size:18px;}

  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--border); border-radius:14px;}
  table.cal{width:100%; border-collapse:collapse; font-size:12.5px; background:var(--card);}
  table.cal th{background:var(--sky-light); color:#2c5570; font-weight:700; padding:7px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.02em; white-space:nowrap; position:sticky; top:0;}
  table.cal td{padding:5px 3px; text-align:center; border-bottom:1px solid var(--border);}
  table.cal input, table.cal select{width:100%; min-width:56px; padding:5px 3px; font-size:12px; text-align:center; border:1px solid var(--border); border-radius:6px;}
  table.cal select{min-width:64px;}
  table.cal td.dia{font-weight:700; min-width:28px;}
  table.cal td.total{font-weight:700; background:var(--peach-light); border-radius:6px;}

  .total-card{background:linear-gradient(135deg,var(--peach),var(--butter)); border-radius:18px; padding:22px; text-align:center; color:#4a3520; margin-bottom:14px;}
  .total-card .lbl{font-size:12.5px; opacity:.85; font-weight:600;}
  .total-card .num{font-family:'Fraunces','Georgia',serif; font-size:40px; font-weight:700; margin:2px 0;}
  .total-card .unit{font-size:12.5px; opacity:.85;}
  .total-card button{margin-top:12px;}

  footer.note{text-align:center; color:var(--muted); font-size:11px; padding:18px 24px 4px;}
  .backup-line{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .file-btn{display:inline-block; font-size:12px; padding:7px 12px; border-radius:9px; background:transparent; border:1px solid var(--border); color:var(--muted); cursor:pointer; font-weight:600;}
  .file-btn input{display:none;}
  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:#FFF9EF; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; z-index:999; opacity:0; pointer-events:none; transition:opacity .2s;}
  .toast.show{opacity:1;}

  #printArea{display:none;}
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block; position:absolute; top:0; left:0; width:100%; padding:20px; }
    #printArea h2{font-size:18px; margin-bottom:2px;}
    #printArea .p-sub{font-size:13px; color:#555; margin-bottom:14px;}
    #printArea table{width:100%; border-collapse:collapse; font-size:11px;}
    #printArea th, #printArea td{border:1px solid #ccc; padding:4px 6px; text-align:center;}
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="top">
    <h1>🕒 Mi Control Horario</h1>
    <div class="sub">Aitor Martínez</div>
    <div id="cloudBadge" style="font-size:12px; margin-top:6px; font-weight:600;"></div>
  </header>

  <main id="main"></main>

  <footer class="note">
    Sincronizado entre tus dispositivos.
    <div class="backup-line">
      <button class="file-btn" onclick="exportJSON()" style="border:none; background:none; text-decoration:underline; cursor:pointer;">Copia de seguridad</button>
      <label class="file-btn">Restaurar copia<input type="file" accept="application/json" onchange="importJSON(event)"></label>
    </div>
  </footer>
</div>

<div id="printArea">
  <h2 id="p-title"></h2>
  <div class="p-sub" id="p-sub"></div>
  <table id="p-table"></table>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= Almacenamiento local (solo este dispositivo) ================= */
const DB = {
  get(key, fallback){ try{ const r = localStorage.getItem('aitor_horario_'+key); return r?JSON.parse(r):fallback; }catch(e){return fallback;} },
  set(key,value){ localStorage.setItem('aitor_horario_'+key, JSON.stringify(value)); }
};
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad2(n){ return String(n).padStart(2,'0'); }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function monthKey(y,m){ return y+'-'+pad2(m+1); }
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function timeOptions(){
  const arr = [''];
  for(let h=0; h<24; h++){ for(let m=0; m<60; m+=15){ arr.push(pad2(h)+':'+pad2(m)); } }
  return arr;
}
const TIME_OPTIONS = timeOptions();
function timeSelect(value, onchange){
  return `<select onchange="${onchange}">${TIME_OPTIONS.map(t=>`<option value="${t}" ${t===(value||'')?'selected':''}>${t===''?'-':t}</option>`).join('')}</select>`;
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ================= Sincronización en la nube (tu Supabase personal) =================
   Sin PIN: la clave "anon" puede leer y escribir directamente, igual que la app
   del restaurante. Así lo que edites en el ordenador o en el móvil se ve en ambos. */
const SUPABASE_URL = 'https://bzjzedwbahgitunoksps.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GwXGrJorusdd94VeHBH4Lg_C657Knj5';
const SB_TABLE = 'aitor_horario';
let cloudStatus = 'conectando'; // conectando | ok | error

function sbHeaders(extra){
  return Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json' }, extra||{});
}
async function sbSet(key, value){
  let ok = false;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?on_conflict=key`, {
      method:'POST',
      headers: sbHeaders({ Prefer:'resolution=merge-duplicates' }),
      body: JSON.stringify([{ key:key, value:value }])
    });
    ok = res.ok;
    cloudStatus = ok ? 'ok' : 'error';
  }catch(e){ cloudStatus = 'error'; }
  renderCloudBadge();
  return ok;
}
// Cola de escritura: cada guardado espera a que termine el anterior antes de mandarse,
// para que dos guardados seguidos no puedan llegar a la nube en orden distinto al que
// los hiciste (eso es lo que podía "perder" una edición reciente).
let sbWriteChain = Promise.resolve();
function queueCloudSave(){
  sbWriteChain = sbWriteChain.then(async ()=>{
    const ok = await sbSet('turnos', turnos);
    if(ok) DB.set('pendingSync', false);
  });
  return sbWriteChain;
}
async function sbGetTurnos(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?select=value&key=eq.turnos`, { headers: sbHeaders() });
  if(!res.ok) throw new Error('No se pudo leer de Supabase');
  const rows = await res.json();
  return rows.length ? rows[0].value : null;
}
function renderCloudBadge(){
  const el = document.getElementById('cloudBadge');
  if(!el) return;
  const map = {
    conectando: ['⏳','Conectando...','var(--muted)'],
    ok: ['☁️','Sincronizado','#3d5c37'],
    error: ['⚠️','Sin conexión, guardado solo en este dispositivo','#8A4650'],
  };
  const [ic,txt,color] = map[cloudStatus];
  el.innerHTML = `<span style="color:${color}">${ic} ${txt}</span>`;
}
// Orden de prioridad al construir los datos que se muestran:
//  1) SEED_TURNOS  → lo horneado en este archivo (los PDF que te he metido), como base.
//  2) la nube       → manda sobre el seed en cuanto hay algo guardado ahí.
//  3) este dispositivo → solo manda por encima si de verdad tenías una edición sin
//     confirmar (pendingSync=true), y solo para los meses que hayas tocado tú.
// Así, abrir el archivo o que yo añada un mes nuevo NUNCA puede pisar por encima
// de datos que ya estaban bien guardados en la nube.
async function initCloudSync(){
  cloudStatus = 'conectando'; renderCloudBadge();
  const pending = DB.get('pendingSync', false);
  const localSnapshot = turnos;
  try{
    const cloudTurnos = await sbGetTurnos();
    let merged = Object.assign({}, SEED_TURNOS, cloudTurnos || {});
    let needsPush = !cloudTurnos; // la nube está vacía todavía: hay que subir la base
    if(pending){
      merged = Object.assign(merged, localSnapshot);
      needsPush = true;
    }
    turnos = merged;
    persistLocalOnly();
    if(needsPush){ await queueCloudSave(); } else { cloudStatus = 'ok'; }
  }catch(e){
    // Sin conexión: no sabemos qué hay en la nube, así que mostramos lo horneado
    // en este archivo fusionado con lo último que ya teníamos en este dispositivo
    // (sin forzar nada hacia la nube, para no arriesgarnos a subir algo a medias).
    turnos = Object.assign({}, SEED_TURNOS, localSnapshot);
    persistLocalOnly();
    cloudStatus = 'error';
  }
  renderCloudBadge();
  renderAll();
}

/* ================= Estado (una sola persona: Aitor Martínez) ================= */

function persistLocalOnly(){ DB.set('turnos', turnos); }
function persistTurnos(){
  DB.set('turnos', turnos);
  DB.set('pendingSync', true);
  queueCloudSave();
}

    seedRow(20,'','','','','',''),
    seedRow(21,'','','','','',''),
    seedRow(22,'','','','','',''),
    seedRow(23,'','','','','',''),
    seedRow(24,'','','','','',''),

    seedRow(27,'','','','','',''),

    seedRow(30,'','','','','',''),

  ],
};
// Al abrir el archivo, ve directo al mes más reciente que te he rellenado
// (esto solo decide qué mes se ve primero; la fusión real de datos la hace
// initCloudSync más abajo, sin depender de esto).
const seedKeys = Object.keys(SEED_TURNOS).sort();
if(seedKeys.length){
  const [ly, lm] = seedKeys[seedKeys.length-1].split('-').map(Number);
  horYear = ly; horMonth = lm-1;
}

function getMonthRows(y, m){
  const key = monthKey(y,m);
  if(!turnos[key]){
    // Mes que no existe en ningún sitio todavía (ni nube, ni seed, ni local):
    // se crea vacío solo para poder mostrarlo. Esto NO cuenta como una edición
    // tuya, así que se guarda solo en este dispositivo sin marcarlo como
    // "pendiente de sincronizar" ni forzar que gane sobre la nube.
    const n = daysInMonth(y,m);
    turnos[key] = Array.from({length:n}, (_,i)=>({id:uid(), dia:i+1, entM:'',salM:'',horasM:'',entN:'',salN:'',horasN:''}));
    persistLocalOnly();
  }
  return turnos[key];
}
function rowTotal(r){ return (parseFloat(r.horasM)||0) + (parseFloat(r.horasN)||0); }
function monthTotal(rows){ return rows.reduce((s,r)=>s+rowTotal(r),0); }

function renderApp(){
  const rows = getMonthRows(horYear, horMonth);
  const total = monthTotal(rows);
  return `
    <div class="month-nav">
      <button onclick="shiftMonth(-1)">‹ Anterior</button>
      <div class="label"><h2>${MESES[horMonth]} ${horYear}</h2></div>
      <button onclick="shiftMonth(1)">Siguiente ›</button>
    </div>

    <div class="total-card">
      <div class="lbl">Total del mes</div>
      <div class="num">${total.toFixed(1)}</div>
      <div class="unit">horas trabajadas</div>
      <button class="btn btn-add btn-sm" onclick="printMes()">🖨️ Sacar PDF</button>
    </div>

    <div class="table-wrap">
      <table class="cal">
        <thead><tr><th>Día</th><th>Ent.M</th><th>Sal.M</th><th>Hs.M</th><th>Ent.N</th><th>Sal.N</th><th>Hs.N</th><th>Total</th></tr></thead>
        <tbody>
        ${rows.map(r => `
          <tr>
            <td class="dia">${r.dia}</td>
            <td>${timeSelect(r.entM, `updCell('${r.id}','entM',this.value)`)}</td>
            <td>${timeSelect(r.salM, `updCell('${r.id}','salM',this.value)`)}</td>
            <td><input type="number" step="0.5" value="${r.horasM||''}" placeholder="0" onchange="updCell('${r.id}','horasM',this.value)"></td>
            <td>${timeSelect(r.entN, `updCell('${r.id}','entN',this.value)`)}</td>
            <td>${timeSelect(r.salN, `updCell('${r.id}','salN',this.value)`)}</td>
            <td><input type="number" step="0.5" value="${r.horasN||''}" placeholder="0" onchange="updCell('${r.id}','horasN',this.value)"></td>
            <td class="total">${rowTotal(r).toFixed(1)}</td>
          </tr>
        `).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function updCell(rowId, field, value){
  const rows = getMonthRows(horYear, horMonth);
  const r = rows.find(x=>x.id===rowId);
  if(!r) return;
  r[field] = value;
  persistTurnos(); renderAll();
}
function shiftMonth(delta){
  horMonth += delta;
  if(horMonth<0){ horMonth=11; horYear--; }
  if(horMonth>11){ horMonth=0; horYear++; }
  renderAll();
}

/* ================= Copia de seguridad ================= */
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function exportJSON(){
  const data = { version:1, empleado:'Aitor Martínez', exportado: new Date().toISOString(), turnos };
  downloadBlob(JSON.stringify(data, null, 2), `mi_horario_${new Date().toISOString().slice(0,10)}.json`, 'application/json');
  toast('Copia descargada');
}
function importJSON(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data.turnos) throw new Error('Formato no reconocido');
      if(!confirm('Esto reemplazará tus datos actuales por los del archivo importado. ¿Continuar?')) return;
      turnos = data.turnos;
      persistTurnos();
      renderAll();
      toast('Datos restaurados');
    }catch(err){
      alert('No se ha podido leer el archivo: ' + err.message);
    }
    evt.target.value = '';
  };
  reader.readAsText(file);
}
function printMes(){
  const rows = getMonthRows(horYear, horMonth);
  const total = monthTotal(rows);
  document.getElementById('p-title').textContent = 'Control Horario — Aitor Martínez';
  document.getElementById('p-sub').textContent = `${MESES[horMonth]} ${horYear} · Total: ${total.toFixed(1)} horas`;
  const headers = ['Día','Ent.M','Sal.M','Hs.M','Ent.N','Sal.N','Hs.N','Total'];
  let html = '<thead><tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{
    html += `<tr><td>${r.dia}</td><td>${r.entM||'-'}</td><td>${r.salM||'-'}</td><td>${r.horasM||'0'}</td><td>${r.entN||'-'}</td><td>${r.salN||'-'}</td><td>${r.horasN||'0'}</td><td>${rowTotal(r).toFixed(1)}</td></tr>`;
  });
  html += '</tbody>';
  document.getElementById('p-table').innerHTML = html;
  window.print();
}

function renderAll(){
  document.getElementById('main').innerHTML = renderApp();
}
renderAll();
initCloudSync();

// Aviso si cierras/recargas la pestaña mientras un cambio todavía no se ha
// confirmado como guardado en la nube (evita cerrar por error justo a tiempo).
window.addEventListener('beforeunload', function(e){
  if(DB.get('pendingSync', false)){
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
